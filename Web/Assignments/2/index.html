<html>
    <head>
        <title>Review carousel</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="real-box">
            <h1 id="revies" class="review">Our Reviews</h1>
            <div id="frame" class="frame">
                <img src="isagi.png" id="zurag" alt="isagi profile">
                <p id="name">Isagi Yoichi</p>
                <p id="job">FOOTBALLER</p>
                <p id="about" class="about">Yoichi Isagi is the main protagonist of the Japanese manga and anime series Blue Lock, a high school striker who enters a ruthless training program to become the world's best forward.</p>

                <!-- prev next buttons-->
                 <div class="button-container">
                    <button type="button" class="prev-btn">
                        &lt;
                    </button>
                    <button type="button" class="next-btn">
                        &gt;
                    </button>
                 </div>
                <!-- random btn-->
                 <button class="random-btn">Surprise me</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
