<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алхам 5 — Сонголтын элементүүд</title>
</head>
<body>
    <h2>Буузны газар — Захиалга</h2>


    <p>Үндсэн хоол:</p>

    <select id="khool">
        <option value="2500">Бууз — 2,500₮</option>
        <option value="3000">Хуушуур — 3,000₮</option>
        <option value="8000">Цуйван — 8,000₮</option>
    </select>
    <p>Нэмэлт:</p>

    <label><input type="checkbox" id="tsai" value="1000"> Сүүтэй цай — 1,000₮</label><br>
    <label><input type="checkbox" id="salat" value="1500"> Салат — 1,500₮</label>


    <p>Хэрхэн авах вэ:</p>
    <label><input type="radio" name="avakh" value="0" checked> Энд идэх</label><br>
    <label><input type="radio" name="avakh" value="500"> Авч явах (сав +500₮)</label>
    
    <h3 id="niit">Нийт: 2500₮</h3>
    <script src="script.js"></script>
</body>
</html>
