<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Буузны газар</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <nav class="flex justify-between items-center bg-white px-8 py-4 shadow">
        <span class="text-2xl font-bold text-orange-600">Буузны газар</span>
        <div class="flex gap-6 text-gray-700">
            <a href="#" class="hover:text-orange-900">Цэс</a>
            <a href="#" class="hover:text-orange-100">Холбоо барих</a>
        </div>
    </nav>
    <main class="p-4 md:p-8">
        <h1 class="text-3xl font-bold mb-6">Манай цэс</h1>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-bold mb-2">Бууз</h2>
            <p class="text-gray-600 mb-4">Уламжлалт махан бууз</p>
            <div class="flex justify-between items-center">
                <span class="text-green-600 font-bold">2,500₮</span>
                <button class="bg-orange-500 text-white px-4 py-2 rounded-lg
                         hover:bg-orange-700 transition">Захиалах</button>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-bold mb-2">Хуушуур</h2>
            <p class="text-gray-600 mb-4">Шарсан махан хуушуур</p>
            <div class="flex justify-between items-center">
                <span class="text-green-600 font-bold">3,000₮</span>
                <button class="bg-orange-500 text-white px-4 py-2 rounded-lg
                hover:bg-orange-700 transition">Захиалах</button>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-xl font-bold mb-2">Банштай шөл</h2>
            <p class="text-gray-600 mb-4">Халуун банштай шөл</p>
            <div class="flex justify-between items-center">
                <span class="text-green-600 font-bold">8,000₮</span>
                <button class="bg-orange-500 text-white px-4 py-2 rounded-lg
                 hover:bg-orange-700 transition">Захиалах</button>
            </div>
            </div>
        </div>
    </main>
 <footer class="text-center text-gray-500 py-6 mt-8">
    © 2026 Буузны газар
 </footer>
</body>
</html>
